name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  github-pages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: ruby/setup-ruby@v1.268.0
        with:
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version-file: '.tool-versions'
          cache: 'yarn'
      - run: yarn
      - name: Build site
        run: yarn build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
